<p><b>- Your Zahid ❤️</b></p>

</div>
<script>
setInterval(()=>{let h=document.createElement('div');h.innerHTML='❤️';h.style.position='fixed';h.style.left=Math.random()*100+'vw';h.style.top='-20px';h.style.fontSize='20px';document.body.appendChild(h);setTimeout(()=>h.remove(),3000)},300)

</body></html>
